<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This Day card</title>
<style>
/* 1080x1350 portrait card for Facebook and Instagram feeds, in the site's ticket style */
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-700.woff2') format('woff2');font-weight:700}
@font-face{font-family:'DM Sans';src:url('fonts/dmsans.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Dot';src:url('/fonts/vt323.woff2') format('woff2')}
@font-face{font-family:'Journal';src:url('/fonts/journal.woff2') format('woff2')}
:root{--ink:#2a2f7a;--blue:#4a82ff;--red:#f5222d;--cream:#f7f1e1;--muted:#b8bcc2;--rainbow:linear-gradient(90deg,#f5222d,#ff8a00,#f8c537,#3bb273,#4a82ff,#8b4dd8)}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;background:#000;overflow:hidden}
.card{position:relative;width:1080px;height:1350px;padding:64px 72px 0;display:flex;flex-direction:column;gap:34px;color:var(--cream);font-family:'DM Sans',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between}
.top img{width:380px}
.kicker{font:400 34px 'Dot',monospace;letter-spacing:.08em;color:var(--red);text-align:right;line-height:1.05}
.date{margin:0;font:700 128px/0.9 'Fraunces',serif;letter-spacing:-2px;white-space:nowrap}
.date small{display:block;margin-top:14px;font:400 44px 'Dot',monospace;letter-spacing:.06em;color:var(--muted)}
.ticket{position:relative;display:flex;border-radius:10px;overflow:hidden;color:var(--ink);font-family:'Dot',monospace;text-transform:uppercase;
 background:repeating-linear-gradient(135deg,#0000 0 9px,#9cc3e633 9px 10px),linear-gradient(180deg,#eef6fb,#f6eef4)}
.ticket::before{content:'';position:absolute;inset:0 0 auto;height:14px;background:var(--rainbow)}
.stub{flex:0 0 150px;padding:40px 18px 22px;border-right:3px dashed #8aa3c2;display:flex;flex-direction:column;justify-content:space-between;font-size:30px}
.doodle{display:block;width:76px;height:76px;background:url('/tape-doodles.webp') 0 50%/300% 100% no-repeat,var(--c,#c4243a);background-blend-mode:screen;mix-blend-mode:multiply;opacity:.8}
.doodle.d1{background-position:50% 50%,0 0;--c:#2a5bd7}.doodle.d2{background-position:100% 50%,0 0;--c:#8b4dd8}
.body{flex:1;min-width:0;padding:40px 36px 30px}
.body .band{font-size:36px;letter-spacing:.04em}
.body .venue{margin-top:6px;font-size:62px;line-height:1}
.body .city{font-size:38px}
.body .when{margin-top:12px;font-size:56px;line-height:1}
.boxes{display:flex;gap:10px;margin-top:20px}
.boxes span{display:flex;flex-direction:column;padding:6px 14px 4px;border:2px solid #2a2f7a99;font-size:40px;line-height:1}
.boxes small{font-size:22px;opacity:.75}
.boxes .foil{background:linear-gradient(135deg,#d7e3ff,#f9d6f2 30%,#d6fbf0 55%,#fff3c4 80%,#d7e3ff);border-color:#8b4dd8aa}
.feature{display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;padding:10px 18px;border-radius:6px;font:400 40px 'Dot',monospace;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:#fff}
.badge.first{background:var(--blue)}.badge.last{background:var(--cream);color:#141414}.badge.show{background:#f8c537;color:#141414}
.song{margin:0;font:400 104px/1 'Journal',cursive;color:var(--cream);text-wrap:balance}
.line{margin:0;font:500 34px/1.3 'DM Sans',sans-serif;color:var(--muted)}
.foot{margin-top:auto;padding:26px 0 40px;display:flex;justify-content:space-between;align-items:center;font:400 40px 'Dot',monospace;letter-spacing:.06em}
.foot b{font-weight:400;color:var(--cream)}.foot span{color:var(--muted)}
.rainbow{position:absolute;inset:auto 0 0;height:16px;background:var(--rainbow)}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
window.renderCard = d => {
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const badge = {best:'The Best', first:'The First', last:'The Last', show:'On this day'}[d.kind];
  document.getElementById('card').innerHTML = `
    <div class="top"><img src="/logo-tight.webp" alt=""><div class="kicker">THIS DAY IN<br>DEAD HISTORY</div></div>
    <h1 class="date">${esc(d.monthDay)}<small>${esc(d.yearsAgo)} YEARS AGO TODAY</small></h1>
    <div class="ticket"><div class="stub"><span>${esc(d.code)}</span><span><i class="doodle d0"></i><i class="doodle d1"></i><i class="doodle d2"></i></span><span>${esc(d.short)}</span></div>
      <div class="body"><div class="band">THE GRATEFUL DEAD</div><div class="venue">${esc(d.venue)}</div><div class="city">${esc(d.city)}</div><div class="when">${esc(d.when)}</div>
      <div class="boxes"><span><small>SEC</small>GA</span><span><small>ROW</small>GEN</span><span><small>SEAT</small>ADM</span><span class="foil"><small>YEARS AGO</small>${esc(d.yearsAgo)}</span></div></div></div>
    <div class="feature"><span class="badge ${d.kind}">${badge}</span><p class="song">${esc(d.headline)}</p><p class="line">${esc(d.line)}</p></div>
    <div class="foot"><b>FIRSTLASTBEST.COM</b><span>LISTEN FREE</span></div><div class="rainbow"></div>`;
  return document.fonts.ready;
};
</script>
</body>
</html>
